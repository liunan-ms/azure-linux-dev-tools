# Optional manual release targets for `tito release`.
#
# These are NOT required for the recommended COPR autobuild setup (COPR SCM
# package + GitHub webhook drives builds automatically). They are handy if you
# want to push a build to COPR by hand from a checkout with:
#
#     tito release copr-stable      # builds the latest azldev-X.Y.Z-R tag
#     tito release copr-dev --test  # builds the current HEAD of main
#
# Replace @OWNER with the COPR owner (a user like `jdoe` or a group like
# `@azurelinux`).

[copr-stable]
releaser = tito.release.CoprReleaser
project = @OWNER/azldev-stable

[copr-dev]
releaser = tito.release.CoprReleaser
project = @OWNER/azldev-dev
